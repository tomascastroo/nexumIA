name: CI

on:
  push:
    branches: [ main, master, develop, feat/**, fix/**, refactor/**, chore/**, ci/** ]
  pull_request:
    branches: [ main, master, develop, feat/** ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexum
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      ENVIRONMENT: test
      SECRET_KEY: dummy_secret_key_change_me
      JWT_ALG: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      ENABLE_METRICS: "true"

      # Providers dummy
      OPENAI_API_KEY: dummy
      TWILIO_ACCOUNT_SID: dummy
      TWILIO_AUTH_TOKEN: dummy
      TWILIO_WHATSAPP_NUMBER: whatsapp:+14155238886

      # Flags para CI
      CI: "true"
      DISABLE_EXTERNAL_SERVICES: "true"
      TWILIO_DISABLE: "true"
      OPENAI_DISABLE: "true"

      # DB/Cache
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexum
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Upgrade pip tooling
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-cov bandit

      - name: Wait for Postgres
        run: |
          for i in {1..15}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 2
          done

      - name: Run migrations (if alembic configured)
        run: |
          if [ -f alembic.ini ]; then
            pip install alembic
            alembic upgrade head || echo "Skipping migrations if not configured"
          fi

      - name: Lint (ruff - all rules)
        run: ruff check .

      - name: Type check (mypy, ignore missing imports)
        run: mypy --ignore-missing-imports --install-types --non-interactive || true

      - name: SAST (bandit)
        run: bandit -r . -x tests --skip B101,B105,B106,B107,B307
      

      - name: Run tests (skip external/integration)
        run: pytest -q --maxfail=1 --disable-warnings -k "not twilio and not external and not integration"

      - name: Run tests with coverage
        run: pytest --cov=.

      - name: Build frontend
        run: |
          cd frontend && npm ci && npm run build

          